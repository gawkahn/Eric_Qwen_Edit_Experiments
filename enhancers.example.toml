# comfyless prompt-enhancer backend registry (ADR-026).
# Copy to ./enhancers.toml (gitignored) and edit, or point $COMFYLESS_ENHANCERS
# at your own file. Each [name] is a backend; --enhance-prompt <name> selects it.
#
# type = "hunyuan-reprompt"  → local Tencent HunYuanDenseV1 reprompt model.
#   Uses Tencent's baked Chinese system prompt; IGNORES --enhance-recipe.
# type = "openai-endpoint"   → any OpenAI-compatible /v1 chat server (LM Studio,
#   vLLM, Gemma, …). Uses the selected recipe's system prompt.
#
# Secrets: never put an API key inline. Use key_env = "ENV_VAR_NAME" and export
# the key in your environment. Local endpoints usually need no key.

[hunyuan]
type      = "hunyuan-reprompt"
model     = "/path/to/hf-local/HunyuanImage-2.1/reprompt"
device    = "cuda"     # optional (default "cuda")
precision = "bf16"     # optional (bf16|fp16|fp32; default bf16)
# quant   = "fp8"      # weight-only fp8 → ~14 GB down to ~7 GB (halves the
                       #   reprompt model; helps the base+refiner+reprompt stack fit)
# Sampling knobs (optional; defaults are Tencent's). Raise temperature/top_p
# for more diverse --variations. hunyuan ignores recipes, so tune it HERE:
# temperature = 0.9    # default 0.7
# top_p       = 0.95   # default 0.8
# top_k       = 20
# repetition_penalty = 1.05

# Endpoint sampling precedence is recipe > backend cfg > default (ADR-026):
# whatever the selected recipe sets WINS over the values below, so tune per-run
# diversity in the recipe, not here — the knobs below are the fallback for
# recipes that omit them. temperature defaults to 0.8; top_p/top_k/
# repetition_penalty are emitted only when set (top_k + repetition_penalty are
# vLLM extensions stricter servers reject).
[gemma-dense]
type    = "openai-endpoint"
url     = "http://localhost:8016/v1"
temperature = 0.9    # default 0.8 (shadowed by a recipe that sets temperature)
top_p       = 0.95
top_k       = 20
repetition_penalty = 1.05
# batch_variations = true   # request all --variations in ONE call via the
                            #   OpenAI `n` param (throughput win on vLLM). It is
                            #   a toggle — the COUNT comes from --variations N.
# model = "gemma-3-dense"   # optional; if omitted, resolved from /v1/models
# key_env = "OPENAI_API_KEY"  # optional; env-var NAME holding the key

[gemma-moe]
type = "openai-endpoint"
url  = "http://localhost:8017/v1"
temperature = 0.9    # default 0.8 (shadowed by a recipe that sets temperature)
top_p       = 0.95
top_k       = 20
repetition_penalty = 1.05
# batch_variations = true   # see [gemma-dense] above
