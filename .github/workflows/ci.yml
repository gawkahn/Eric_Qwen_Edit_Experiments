# CI gate — quality-gate kit adoption, 2026-07-16 (reference: local_agents).
#
# ALL SIX KIT GATES ADOPTED (2026-07-16): secrets, commit-policy, sast,
# supply-chain, types, tests. Kit README:
# ~/.claude/templates/quality-gate-kit-python-uv/.
#
# Fails the build on:
#   - any git-policy smoke-test regression (scripts/git-policy/)
#   - any repo-policy violation in a PR's commits (the authoritative mirror of
#     the pre-commit layer — a local --no-verify / SKIP bypass is caught here)
#   - any committed secret (gitleaks, 0-baseline — measured clean at adoption)
#   - any semgrep SAST finding (0-baseline, 7 triaged suppressions inline)
#   - any non-registry lock source, non-ADR-031 license, or known CVE in the
#     locked deps (two documented no-fix ignores in osv-scanner.toml)
#   - any pyright error count ABOVE .claude/typecheck-baseline (ADR-032
#     ratchet — the authoritative fail-CLOSED mirror of the local hook)
#   - any test-suite failure (`just tests` — the standalone test_*.py battery;
#     verified CPU-safe by a CUDA_VISIBLE_DEVICES="" full run at adoption)
#
# Supply chain (global CLAUDE.md §11):
#   - every `uses:` is pinned to a commit SHA, not a floating tag.
#   - the mise BINARY is exact-pinned; mise.toml pins gitleaks/just.
#
# Least privilege: read-only token, no secrets. Uses `pull_request` (NOT
# `pull_request_target`), so fork PRs run with no secret access.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-policy:
    name: git-policy smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # persist-credentials: false — don't leave GITHUB_TOKEN in .git/config
      # next to repo-controlled scripts (read-only token today; belt-and-
      # suspenders regardless).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: git-policy smoke tests
        run: bash scripts/git-policy/test-git-policy.sh

  commit-policy:
    name: commit policy (PR only)
    # The authoritative CI mirror of the pre-commit repo-policy checks:
    # validates the PR's commit range. PR-only — direct pushes to main are
    # covered by the local pre-commit layer + the harness hook. Becomes a hard
    # gate only once branch protection requires PRs (kit README step 9).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # need base + head commits for the range check
          persist-credentials: false
      - name: repo-policy checks over PR commits
        run: >
          bash scripts/git-policy/check-range.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  tests:
    name: tests (standalone suite battery)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.7" # match dev box; exact pin per §11
          enable-cache: false
      # Full locked venv (CUDA wheel tree included — the lock is exact; the
      # suites are proven CPU-safe, GPU never touched). UV_NO_CACHE: don't
      # hold the wheels twice on runner disk.
      - run: uv sync --locked
        env:
          UV_NO_CACHE: "1"
      # mise provides the pinned `just` for the recipe (single source of truth
      # for the battery loop). Install only `just` — this job needs nothing
      # else from mise.toml.
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: "2026.5.0" # match dev box; exact pin per §11
          install: false
          cache: false
      - run: mise trust ./mise.toml
      - run: mise install just
      - name: run test battery (just tests)
        run: mise exec just -- just tests

  typecheck:
    name: typecheck (pyright ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # uv provides the venv pyright resolves third-party types from
      # (pyproject [tool.pyright] venv=".venv"). UV_NO_CACHE: CUDA wheel tree
      # must not be held twice on the runner disk.
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.7" # match dev box; exact pin per §11
          enable-cache: false
      - run: uv sync --locked
        env:
          UV_NO_CACHE: "1"
      # mise provides the pinned pyright (mise.toml: node + npm:pyright).
      # install:false so we can `mise trust` FIRST — without trust the pins
      # silently do not apply.
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: "2026.5.0" # match dev box; exact pin per §11
          install: false
          cache: false
      - run: mise trust ./mise.toml
      - run: mise install
      # ADR-032 ratchet, fail CLOSED: no parseable count = failure (unlike the
      # local hook, which fails open as a convenience layer).
      - name: pyright (ratchet vs .claude/typecheck-baseline)
        run: |
          set -uo pipefail
          out=$(mise exec -- pyright 2>&1) || true
          echo "$out" | tail -3
          current=$(echo "$out" | grep -oE '[0-9]+ error' | head -1 | grep -oE '[0-9]+')
          [ -n "$current" ] || { echo "FATAL: no error count parsed — failing closed"; exit 1; }
          baseline=$(tr -dc '0-9' < .claude/typecheck-baseline)
          echo "pyright errors: $current (baseline $baseline)"
          [ "$current" -le "$baseline" ] || { echo "RATCHET VIOLATION: $current > $baseline (ADR-032)"; exit 1; }

  supply-chain:
    name: supply chain (sources + license + cve)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.7" # match dev box; exact pin per §11
          enable-cache: false
      # --locked verifies uv.lock integrity hashes; the scans run against it.
      # NOTE: this resolves the full CUDA-wheel tree. UV_NO_CACHE keeps the
      # runner from holding wheels twice (cache + venv would blow ubuntu-latest's
      # ~14 GB free disk — code-reviewer 2026-07-16); if disk/time still becomes
      # a problem, switch the license/cve scans to `uv export`-based inputs
      # that don't install.
      - run: uv sync --locked
        env:
          UV_NO_CACHE: "1"
      # Tier-3 (§11): fail if any dep is from a non-registry (unhashed)
      # source. Fast, no network — fail early before the live scans.
      - name: tier-3 hash sources (§11)
        run: uv run python scripts/check_lock_sources.py
      # mise provides the pinned osv-scanner + just (mise.toml).
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: "2026.5.0" # match dev box; exact pin per §11
          install: false
          cache: false
      - run: mise trust ./mise.toml
      - run: mise install
      # License gate — deterministic; only fails when a dep's license leaves
      # the ADR-031 allowlist. Runs first (fast, no network).
      - name: license policy (ADR-031)
        run: mise exec -- just deps-licenses
      # CVE gate — pip-audit + osv-scanner query live OSV; HARD gate per §11
      # (a newly-published CVE turns even an unrelated push red — that friction
      # IS the rule). Documented ignores: osv-scanner.toml + the recipe's
      # --ignore-vuln flags (TECH_DEBT "Two CVEs unfixable at 2026-07-16").
      - name: cve scan (§11 gate)
        run: mise exec -- just deps-cve

  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.7" # match dev box; exact pin per §11
          enable-cache: false
      # Security static analysis — semgrep exact-pinned; 0-baseline hard gate on
      # the repo's code roots (packs p/python + p/security-audit + p/secrets;
      # tokenless). `--error` fails the job on any finding. Rules are
      # registry-fetched (drift accepted, same posture as a CVE gate); FPs are
      # suppressed inline with # nosemgrep + a justification comment.
      - name: semgrep (SAST — 0-baseline)
        run: >
          uv run --with semgrep==1.169.0 semgrep scan
          --config p/python --config p/security-audit --config p/secrets
          --error --quiet --metrics=off comfyless/ nodes/ pipelines/ scripts/

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history — gitleaks `git` mode scans all commits
          persist-credentials: false
      # mise provides the pinned gitleaks (mise.toml: aqua:gitleaks/gitleaks).
      # install:false so we can `mise trust` FIRST — a repo-local mise.toml is
      # untrusted by default; without trust the pins silently do not apply.
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: "2026.5.0" # match dev box; exact pin per §11
          install: false
          cache: false # don't opt into an implicit actions/cache surface
      - run: mise trust ./mise.toml
      - run: mise install
      # --redact keeps any matched value out of the CI log.
      - name: gitleaks (secret scan)
        run: mise exec -- gitleaks git . --config .gitleaks.toml --no-banner --redact
