# CI gate — quality-gate kit adoption, 2026-07-16 (reference: local_agents).
#
# ALL SIX KIT GATES ADOPTED (2026-07-16): secrets, commit-policy, sast,
# supply-chain, types, tests. Kit README:
# ~/.claude/templates/quality-gate-kit-python-uv/.
#
# Fails the build on:
#   - any git-policy smoke-test regression (scripts/git-policy/)
#   - any repo-policy violation in a PR's commits (the authoritative mirror of
#     the pre-commit layer — a local --no-verify / SKIP bypass is caught here)
#   - any committed secret (gitleaks, 0-baseline — measured clean at adoption)
#   - any semgrep SAST finding (0-baseline, 7 triaged suppressions inline)
#   - any non-registry lock source, non-ADR-031 license, or known CVE in the
#     locked deps (two documented no-fix ignores in osv-scanner.toml)
#   - any pyright error count ABOVE its root's .claude/typecheck-baseline
#     entry (ADR-032 ratchet, ADR-042 per-root aggregation — the
#     authoritative fail-CLOSED mirror of the local hook)
#   - any test-suite failure (`just tests` — the standalone test_*.py battery;
#     verified CPU-safe by a CUDA_VISIBLE_DEVICES="" full run at adoption)
#
# Supply chain (global CLAUDE.md §11):
#   - every `uses:` is pinned to a commit SHA, not a floating tag.
#   - the mise BINARY is exact-pinned; mise.toml pins gitleaks/just.
#
# Least privilege: read-only token, no secrets. Uses `pull_request` (NOT
# `pull_request_target`), so fork PRs run with no secret access.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-policy:
    name: git-policy smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # persist-credentials: false — don't leave GITHUB_TOKEN in .git/config
      # next to repo-controlled scripts (read-only token today; belt-and-
      # suspenders regardless).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: git-policy smoke tests
        run: bash scripts/git-policy/test-git-policy.sh

  commit-policy:
    name: commit policy (PR only)
    # The authoritative CI mirror of the pre-commit repo-policy checks:
    # validates the PR's commit range. PR-only — direct pushes to main are
    # covered by the local pre-commit layer + the harness hook. Becomes a hard
    # gate only once branch protection requires PRs (kit README step 9).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # need base + head commits for the range check
          persist-credentials: false
      - name: repo-policy checks over PR commits
        run: >
          bash scripts/git-policy/check-range.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  tests:
    # ── ADR-045: gated on a cross-repo credential ───────────────────────────
    # The original blocker (a `path` source a lone runner cannot resolve) is
    # GONE as of 2026-09-12: comfyless-diffusion is now a git+https pin. What
    # replaced it is narrower — comfyless_diffusion is a PRIVATE repository and
    # a workflow's default GITHUB_TOKEN is scoped to THIS repo only, so
    # `uv sync --locked` still cannot fetch it without a credential.
    #
    # TO TURN THESE THREE JOBS ON, no code change needed:
    #   1. create a token with read access to gawkahn/comfyless_diffusion
    #      (fine-grained, Contents: read-only is enough)
    #   2. add it as the secret COMFYLESS_CORE_TOKEN
    #   3. set the repository VARIABLE CROSS_REPO_CI to `true`
    # Skipped (not red) until then, because a permanently-red job trains people
    # to ignore CI. `vars` is used for the gate because the `secrets` context is
    # NOT available in a job-level `if:`.
    #
    # LIVE since 2026-09-14: the repository variable CROSS_REPO_CI was set to
    # true and COMFYLESS_CORE_TOKEN provided, so this job and its two siblings
    # run on every push. The auth step below works; the "UNTESTED / has never
    # run" warning that stood here until 2026-09-16 was true when written and
    # false for two days before anyone re-read it. Verified across the five
    # runs since the flag flipped: 3/3 gated jobs green in each.
    #
    # Coverage note, also updated: comfyless_diffusion HAS its own CI as of
    # 2026-09-15 (seven jobs), so its half is no longer covered only by a local
    # `just tests`.
    if: ${{ vars.CROSS_REPO_CI == 'true' }}
    name: tests (standalone suite battery)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.7" # match dev box; exact pin per §11
          enable-cache: false
      # Full locked venv (CUDA wheel tree included — the lock is exact; the
      # suites are proven CPU-safe, GPU never touched). UV_NO_CACHE: don't
      # hold the wheels twice on runner disk.
      # comfyless-diffusion is a git+https pin against a PRIVATE repo, so the
      # fetch needs a credential the default GITHUB_TOKEN does not provide.
      # Rewrites github.com https URLs for git only; Actions masks the token.
      - name: authenticate to the private core repository
        # Fail LOUD on a missing secret. Repository `vars` are exposed to
        # fork-PR runs but secrets are not, so with CROSS_REPO_CI=true every
        # fork PR would otherwise reach `uv sync` with an empty token, get a
        # 404 on the private repo, and report "repository not found" — which
        # reads as "repo deleted", not "secret missing".
        run: |
          [ -n "$TOKEN" ] || { echo "::error::CROSS_REPO_CI is true but COMFYLESS_CORE_TOKEN is empty (fork PR, or secret not set)"; exit 1; }
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          TOKEN: ${{ secrets.COMFYLESS_CORE_TOKEN }}
      - run: uv sync --locked
        env:
          UV_NO_CACHE: "1"
      # mise provides the pinned `just` for the recipe (single source of truth
      # for the battery loop). Install only `just` — this job needs nothing
      # else from mise.toml.
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: "2026.5.0" # match dev box; exact pin per §11
          install: false
          cache: false
      - run: mise trust ./mise.toml
      - run: mise install just
      - name: run test battery (just tests)
        run: mise exec just -- just tests

  typecheck:
    # ── ADR-045: gated on a cross-repo credential ───────────────────────────
    # The original blocker (a `path` source a lone runner cannot resolve) is
    # GONE as of 2026-09-12: comfyless-diffusion is now a git+https pin. What
    # replaced it is narrower — comfyless_diffusion is a PRIVATE repository and
    # a workflow's default GITHUB_TOKEN is scoped to THIS repo only, so
    # `uv sync --locked` still cannot fetch it without a credential.
    #
    # TO TURN THESE THREE JOBS ON, no code change needed:
    #   1. create a token with read access to gawkahn/comfyless_diffusion
    #      (fine-grained, Contents: read-only is enough)
    #   2. add it as the secret COMFYLESS_CORE_TOKEN
    #   3. set the repository VARIABLE CROSS_REPO_CI to `true`
    # Skipped (not red) until then, because a permanently-red job trains people
    # to ignore CI. `vars` is used for the gate because the `secrets` context is
    # NOT available in a job-level `if:`.
    #
    # LIVE since 2026-09-14: the repository variable CROSS_REPO_CI was set to
    # true and COMFYLESS_CORE_TOKEN provided, so this job and its two siblings
    # run on every push. The auth step below works; the "UNTESTED / has never
    # run" warning that stood here until 2026-09-16 was true when written and
    # false for two days before anyone re-read it. Verified across the five
    # runs since the flag flipped: 3/3 gated jobs green in each.
    #
    # Coverage note, also updated: comfyless_diffusion HAS its own CI as of
    # 2026-09-15 (seven jobs), so its half is no longer covered only by a local
    # `just tests`.
    if: ${{ vars.CROSS_REPO_CI == 'true' }}
    name: typecheck (pyright ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # uv provides the venv pyright resolves third-party types from
      # (pyproject [tool.pyright] venv=".venv"). UV_NO_CACHE: CUDA wheel tree
      # must not be held twice on the runner disk.
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.7" # match dev box; exact pin per §11
          enable-cache: false
      # comfyless-diffusion is a git+https pin against a PRIVATE repo, so the
      # fetch needs a credential the default GITHUB_TOKEN does not provide.
      # Rewrites github.com https URLs for git only; Actions masks the token.
      - name: authenticate to the private core repository
        # Fail LOUD on a missing secret. Repository `vars` are exposed to
        # fork-PR runs but secrets are not, so with CROSS_REPO_CI=true every
        # fork PR would otherwise reach `uv sync` with an empty token, get a
        # 404 on the private repo, and report "repository not found" — which
        # reads as "repo deleted", not "secret missing".
        run: |
          [ -n "$TOKEN" ] || { echo "::error::CROSS_REPO_CI is true but COMFYLESS_CORE_TOKEN is empty (fork PR, or secret not set)"; exit 1; }
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          TOKEN: ${{ secrets.COMFYLESS_CORE_TOKEN }}
      - run: uv sync --locked
        env:
          UV_NO_CACHE: "1"
      # mise provides the pinned pyright (mise.toml: node + npm:pyright).
      # install:false so we can `mise trust` FIRST — without trust the pins
      # silently do not apply.
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: "2026.5.0" # match dev box; exact pin per §11
          install: false
          cache: false
      - run: mise trust ./mise.toml
      - run: mise install
      # ADR-032 ratchet (ADR-042 per-root), fail CLOSED: no parseable per-root
      # counts = failure (unlike the local hook, which fails open as a
      # convenience layer). scripts/typecheck-per-root.sh is the single
      # source of the file->root grouping logic, shared with the local hook.
      - name: pyright (ratchet vs .claude/typecheck-baseline, per root)
        run: |
          set -uo pipefail
          current_lines=$(scripts/typecheck-per-root.sh)
          [ -n "$current_lines" ] || { echo "FATAL: no per-root counts parsed — failing closed"; exit 1; }
          echo "$current_lines"
          rc=0
          while IFS='=' read -r root current; do
            [ -z "$root" ] && continue
            current=$(printf '%s' "$current" | tr -dc '0-9')
            [ -n "$current" ] || { echo "FATAL: unparseable count for root '$root' — failing closed"; rc=1; continue; }
            baseline=$(grep -E "^${root}=" .claude/typecheck-baseline | tail -1 | cut -d= -f2 | tr -dc '0-9')
            [ -n "$baseline" ] || { echo "FATAL: no baseline entry for root '$root' — failing closed"; rc=1; continue; }
            echo "  $root: $current (baseline $baseline)"
            if [ "$current" -gt "$baseline" ]; then
              echo "RATCHET VIOLATION: $root: $current > $baseline (ADR-032/ADR-042)"
              rc=1
            fi
          done <<< "$current_lines"
          exit $rc

  # ── Always-on half of the supply chain ──────────────────────────────────────
  # These two gates read uv.lock as a FILE and need no dependency resolution, so
  # the sibling-path problem that skips `supply-chain` does not reach them. They
  # are split out rather than skipped with it (security review 2026-09-09, HIGH):
  # the tier-3 check is the only automated guard on the local-path exception this
  # slice added, and leaving it off would mean a future widening lands silently.
  supply-chain-lock:
    name: supply chain (lock-file gates — no install)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # stdlib only (tomllib): deliberately NOT `uv run`, which would sync.
      - name: tier-3 hash sources (§11)
        run: python3 scripts/check_lock_sources.py
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      - run: mise trust ./mise.toml
      - run: mise install
      # osv-scanner reads the lockfile directly; documented ignores live in
      # osv-scanner.toml.
      - name: cve scan — lockfile (§11 gate)
        run: mise exec -- osv-scanner scan source --lockfile=uv.lock

  supply-chain:
    # ── ADR-045: gated on a cross-repo credential ───────────────────────────
    # The original blocker (a `path` source a lone runner cannot resolve) is
    # GONE as of 2026-09-12: comfyless-diffusion is now a git+https pin. What
    # replaced it is narrower — comfyless_diffusion is a PRIVATE repository and
    # a workflow's default GITHUB_TOKEN is scoped to THIS repo only, so
    # `uv sync --locked` still cannot fetch it without a credential.
    #
    # TO TURN THESE THREE JOBS ON, no code change needed:
    #   1. create a token with read access to gawkahn/comfyless_diffusion
    #      (fine-grained, Contents: read-only is enough)
    #   2. add it as the secret COMFYLESS_CORE_TOKEN
    #   3. set the repository VARIABLE CROSS_REPO_CI to `true`
    # Skipped (not red) until then, because a permanently-red job trains people
    # to ignore CI. `vars` is used for the gate because the `secrets` context is
    # NOT available in a job-level `if:`.
    #
    # LIVE since 2026-09-14: the repository variable CROSS_REPO_CI was set to
    # true and COMFYLESS_CORE_TOKEN provided, so this job and its two siblings
    # run on every push. The auth step below works; the "UNTESTED / has never
    # run" warning that stood here until 2026-09-16 was true when written and
    # false for two days before anyone re-read it. Verified across the five
    # runs since the flag flipped: 3/3 gated jobs green in each.
    #
    # Coverage note, also updated: comfyless_diffusion HAS its own CI as of
    # 2026-09-15 (seven jobs), so its half is no longer covered only by a local
    # `just tests`.
    if: ${{ vars.CROSS_REPO_CI == 'true' }}
    name: supply chain (sources + license + cve)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.7" # match dev box; exact pin per §11
          enable-cache: false
      # --locked verifies uv.lock integrity hashes; the scans run against it.
      # NOTE: this resolves the full CUDA-wheel tree. UV_NO_CACHE keeps the
      # runner from holding wheels twice (cache + venv would blow ubuntu-latest's
      # ~14 GB free disk — code-reviewer 2026-07-16); if disk/time still becomes
      # a problem, switch the license/cve scans to `uv export`-based inputs
      # that don't install.
      # comfyless-diffusion is a git+https pin against a PRIVATE repo, so the
      # fetch needs a credential the default GITHUB_TOKEN does not provide.
      # Rewrites github.com https URLs for git only; Actions masks the token.
      - name: authenticate to the private core repository
        # Fail LOUD on a missing secret. Repository `vars` are exposed to
        # fork-PR runs but secrets are not, so with CROSS_REPO_CI=true every
        # fork PR would otherwise reach `uv sync` with an empty token, get a
        # 404 on the private repo, and report "repository not found" — which
        # reads as "repo deleted", not "secret missing".
        run: |
          [ -n "$TOKEN" ] || { echo "::error::CROSS_REPO_CI is true but COMFYLESS_CORE_TOKEN is empty (fork PR, or secret not set)"; exit 1; }
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          TOKEN: ${{ secrets.COMFYLESS_CORE_TOKEN }}
      - run: uv sync --locked
        env:
          UV_NO_CACHE: "1"
      # Tier-3 (§11): fail if any dep is from a non-registry (unhashed)
      # source. Fast, no network — fail early before the live scans.
      - name: tier-3 hash sources (§11)
        run: uv run python scripts/check_lock_sources.py
      # mise provides the pinned osv-scanner + just (mise.toml).
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: "2026.5.0" # match dev box; exact pin per §11
          install: false
          cache: false
      - run: mise trust ./mise.toml
      - run: mise install
      # License gate — deterministic; only fails when a dep's license leaves
      # the ADR-031 allowlist. Runs first (fast, no network).
      - name: license policy (ADR-031)
        run: mise exec -- just deps-licenses
      # CVE gate — pip-audit + osv-scanner query live OSV; HARD gate per §11
      # (a newly-published CVE turns even an unrelated push red — that friction
      # IS the rule). Documented ignores: osv-scanner.toml + the recipe's
      # --ignore-vuln flags (TECH_DEBT "Two CVEs unfixable at 2026-07-16").
      - name: cve scan (§11 gate)
        run: mise exec -- just deps-cve

  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.7" # match dev box; exact pin per §11
          enable-cache: false
      # Security static analysis — semgrep exact-pinned; 0-baseline hard gate on
      # the repo's code roots (packs p/python + p/security-audit + p/secrets;
      # tokenless). `--error` fails the job on any finding. Rules are
      # registry-fetched (drift accepted, same posture as a CVE gate); FPs are
      # suppressed inline with # nosemgrep + a justification comment.
      # --no-project is load-bearing, not tidiness: without it `uv run` syncs the
      # project environment first, which since the 2026-09-12 git+https pin means
      # cloning the PRIVATE comfyless_diffusion — so this job failed on every
      # push with "could not read Username for 'https://github.com'", unrelated
      # to any finding. semgrep is a static analyzer over source text and needs
      # none of the project's dependencies; skipping the sync also drops a
      # ~500 MiB torch download from a 10-minute job.
      # The scan now runs from a HASH-VERIFIED tool env via `just sast`, shared
      # with the local recipe so both run the identical scanner.
      # `--with semgrep==1.169.0` pinned only the top level: 66 further packages
      # resolved fresh from PyPI on every run, unhashed. `--with-requirements`
      # does NOT fix it — measured 2026-09-16, `uv run` installs a lock whose
      # hashes do not match without complaint (no --require-hashes flag,
      # UV_REQUIRE_HASHES ignored). Only `uv pip install --require-hashes`
      # verifies; scripts/ci-tools/build-tool-env.sh does that.
      #
      # --no-project is still honoured INSIDE the helper's design: it builds an
      # isolated venv and never syncs this project, so the private-core clone
      # that turned this job red on every push since 2026-09-12 still cannot
      # happen here.
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: "2026.5.0" # match dev box; exact pin per §11
          install: false
          cache: false
      - run: mise trust ./mise.toml
      - run: mise install just
      - name: semgrep (SAST — 0-baseline, hash-verified tool env)
        run: mise exec just -- just sast

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history — gitleaks `git` mode scans all commits
          persist-credentials: false
      # mise provides the pinned gitleaks (mise.toml: aqua:gitleaks/gitleaks).
      # install:false so we can `mise trust` FIRST — a repo-local mise.toml is
      # untrusted by default; without trust the pins silently do not apply.
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: "2026.5.0" # match dev box; exact pin per §11
          install: false
          cache: false # don't opt into an implicit actions/cache surface
      - run: mise trust ./mise.toml
      - run: mise install
      # --redact keeps any matched value out of the CI log.
      - name: gitleaks (secret scan)
        run: mise exec -- gitleaks git . --config .gitleaks.toml --no-banner --redact
