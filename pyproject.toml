[project]
name = "comfyui-eric-qwen-edit"
version = "3.1.0"
description = "ComfyUI nodes for multi-model diffusion (Qwen-Image, Flux, Chroma, SDXL, SD3.5, Pony, Illustrious) + Qwen-Edit — 32 nodes for editing, generation, multi-stage, LoRA stacking, Spectrum acceleration, ControlNet-guided generation, and 2× upscale VAE"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.11"
authors = [
    { name = "Eric Hiss", email = "eric@historic.camera" }
]
maintainers = [
    { name = "Eric Hiss", email = "eric@historic.camera" }
]
dependencies = [
    # ── Comfyless dep-divergence rule (ADR-013, 2026-05-16) ─────────────────
    # The comfyless dev/test environment is the uv-managed `.venv` created by
    # `uv sync`. The pin set below is chosen for the comfyless deploy
    # environment, not for ComfyUI Manager compatibility. ComfyUI Manager
    # installs the node pack via `pip install -r requirements.txt` and that
    # path is supported for the node pack only — comfyless dev/test must use
    # `uv sync` (not `pip install -r requirements.txt`) so the lockfile-hash
    # integrity contract (see ADR-013 §5) holds. Pins in this file may
    # diverge from ComfyUI's bundled torch in the future; when that happens,
    # ComfyUI Manager installs may surface as a resolver conflict against
    # ComfyUI core — that conflict is upstream's resolver, not a node-pack
    # break. See `docs/decisions/ADR-013-comfyless-torch-divergence.md` for
    # the architectural rule, and `pyproject.toml` / `uv.lock` for the
    # comfyless-side dep contract.
    # ────────────────────────────────────────────────────────────────────────
    "torch==2.11.0",
    # torchvision is the companion to torch (must match its minor: torch
    # 2.11 ↔ torchvision 0.26). Required by the diffusers SD image-transform
    # path — basic SD generation errors without it. Bumping torchvision drags
    # torch with it, so pin both together.
    "torchvision==0.26.0",
    # torchao provides the fp8 quantize-on-load backend (ADR-019 slice A):
    # diffusers TorchAoConfig + Float8DynamicActivationFloat8WeightConfig.
    # Torch-ecosystem package — keep its pin moving with torch's.
    "torchao==0.17.0",
    # diffusers 0.39.0 (released 2026-07-03) is the first PyPI release with
    # Krea2Pipeline / Krea2Transformer2DModel — replaces the krea-testing git
    # pin (was rev 29a59fd9, 0.39.0.dev0). This pin is what ends the branch's
    # reason to exist; it merges to main with the krea support.
    "diffusers==0.39.0",
    "transformers==5.5.3",
    "accelerate==1.13.0",
    "peft==0.18.1",
    # safetensors 0.8.0: required by diffusers>=0.39.0 (release bumped its
    # floor); keep in lockstep with the diffusers pin.
    "safetensors==0.8.0",
    "pillow==12.3.0",
    "numpy==2.4.4",
    "mcp==1.28.1",
    "click==8.3.3",
    "scipy==1.17.1",
    # ── Tokenizer backends (transformers soft deps) ─────────────────────────
    # Not pulled in transitively by transformers, but required by the
    # diffusers text-encoder paths comfyless drives:
    #   sentencepiece + protobuf — slow→fast conversion of bare `spiece.model`
    #     T5 tokenizers (e.g. Chroma ships spiece.model with no tokenizer.json).
    #   tiktoken — tekken / Mistral-style encoders (Flux.2) and convert fallbacks.
    #   ftfy — CLIP text-cleanup path (SDXL / SD1 / Pony); suppresses the
    #     "ftfy not found" fallback warning.
    # ComfyUI provides its own tokenizers, so the node-pack path doesn't need
    # these — they exist for the comfyless `.venv` (ADR-013).
    # ────────────────────────────────────────────────────────────────────────
    "sentencepiece==0.2.1",
    "protobuf==7.35.1",
    "tiktoken==0.13.0",
    "ftfy==6.3.1",
]

[dependency-groups]
# Dev-only tooling for the comfyless uv path (ADR-013). NOT part of
# [project.dependencies], so the pyproject ↔ requirements.txt direct-dep
# agreement rule (CLAUDE.md) is unaffected — ComfyUI Manager installs never
# see this group.
dev = [
    "pre-commit==4.6.0",   # local enforcement layer (quality-gate kit, 2026-07-16)
]

[project.urls]
Repository = "https://github.com/EricRollei/Eric_Qwen_Edit_Experiments"
Issues = "https://github.com/EricRollei/Eric_Qwen_Edit_Experiments/issues"

[tool.comfy]
PublisherId = "ericrollei"
DisplayName = "Eric Qwen-Edit & Qwen-Image Nodes"
Icon = ""
