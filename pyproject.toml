[project]
name = "comfyui-eric-qwen-edit"
version = "3.1.0"
description = "ComfyUI nodes for multi-model diffusion (Qwen-Image, Flux, Chroma, SDXL, SD3.5, Pony, Illustrious) + Qwen-Edit — 32 nodes for editing, generation, multi-stage, LoRA stacking, Spectrum acceleration, ControlNet-guided generation, and 2× upscale VAE"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.11"
authors = [
    { name = "Eric Hiss", email = "eric@historic.camera" }
]
maintainers = [
    { name = "Eric Hiss", email = "eric@historic.camera" }
]
dependencies = [
    # ── Comfyless dep-divergence rule (ADR-013, 2026-05-16) ─────────────────
    # The comfyless dev/test environment is the uv-managed `.venv` created by
    # `uv sync`. The pin set below is chosen for the comfyless deploy
    # environment, not for ComfyUI Manager compatibility. ComfyUI Manager
    # installs the node pack via `pip install -r requirements.txt` and that
    # path is supported for the node pack only — comfyless dev/test must use
    # `uv sync` (not `pip install -r requirements.txt`) so the lockfile-hash
    # integrity contract (see ADR-013 §5) holds. Pins in this file may
    # diverge from ComfyUI's bundled torch in the future; when that happens,
    # ComfyUI Manager installs may surface as a resolver conflict against
    # ComfyUI core — that conflict is upstream's resolver, not a node-pack
    # break. See `docs/decisions/ADR-013-comfyless-torch-divergence.md` for
    # the architectural rule, and `pyproject.toml` / `uv.lock` for the
    # comfyless-side dep contract.
    # ────────────────────────────────────────────────────────────────────────
    "torch==2.11.0",
    "diffusers==0.37.1",
    "transformers==5.5.3",
    "accelerate==1.13.0",
    "peft==0.18.1",
    "safetensors==0.7.0",
    "pillow==12.2.0",
    "numpy==2.4.4",
    "scipy==1.17.1",
    "mcp==1.27.0",
    "click==8.3.2",
    "scipy==1.17.1",
]

[project.urls]
Repository = "https://github.com/EricRollei/Eric_Qwen_Edit_Experiments"
Issues = "https://github.com/EricRollei/Eric_Qwen_Edit_Experiments/issues"

[tool.comfy]
PublisherId = "ericrollei"
DisplayName = "Eric Qwen-Edit & Qwen-Image Nodes"
Icon = ""
